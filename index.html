<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Patrimônio e OS</title>
<style>
:root{--bg:#eef0ec;--sf:#fff;--tx:#1a2225;--mu:#5b676b;--bd:#d3d8d3;--ac:#0b5c8a;--on:#fff;--ok:#1d7647;--okb:#dff1e6;--wn:#8a5300;--wnb:#fbebcb;--er:#b3261e;--erb:#f9dedb;--mub:#e4e8e4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191b;--sf:#1e2528;--tx:#e8ecea;--mu:#9aa6a9;--bd:#334044;--ac:#5bb4e6;--on:#0a1a24;--ok:#6fd49a;--okb:#1c3a2a;--wn:#f0b95a;--wnb:#3d2f12;--er:#ff8f86;--erb:#472220;--mub:#2a3336;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14191b;--sf:#1e2528;--tx:#e8ecea;--mu:#9aa6a9;--bd:#334044;--ac:#5bb4e6;--on:#0a1a24;--ok:#6fd49a;--okb:#1c3a2a;--wn:#f0b95a;--wnb:#3d2f12;--er:#ff8f86;--erb:#472220;--mub:#2a3336;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
#app{max-width:860px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:1.25rem;margin:4px 0 12px}
h2{font-size:1.1rem;margin:0 0 10px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--bd);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;color:var(--mu);padding:10px 14px;font:inherit;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;cursor:pointer}
.tabs button.on{color:var(--ac);border-color:var(--ac)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:9px 14px}
button.pri{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
button.dg{color:var(--er);border-color:var(--er)}
button.sm{padding:6px 10px;font-size:.9rem}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
input,select{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx)}
label{display:block;font-size:.9rem;color:var(--mu);margin-bottom:10px}
label input,label select{margin-top:3px;color:var(--tx)}
label.chk{display:flex;gap:8px;align-items:center;color:var(--tx)}
label.chk input{width:auto;margin:0}
.bar{display:flex;gap:8px;margin-bottom:12px}
.bar input{flex:1}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;font-size:.9rem;color:var(--mu)}
.stat b{display:block;font-size:1.3rem;color:var(--tx)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .pat{font-weight:700;font-size:1.05rem}
.mu{color:var(--mu);font-size:.9rem}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.8rem;font-weight:600;background:var(--mub);color:var(--mu);margin:2px 4px 2px 0}
.chip.ok{background:var(--okb);color:var(--ok)}.chip.wn{background:var(--wnb);color:var(--wn)}.chip.er{background:var(--erb);color:var(--er)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{padding:30px 10px;text-align:center;color:var(--mu)}
.pick{max-height:240px;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:4px 8px;margin-bottom:6px}
.pick label{display:flex;gap:8px;align-items:center;color:var(--tx);margin:0;padding:7px 0;border-bottom:1px solid var(--bd)}
.pick label:last-child{border:0}
.pick input{width:auto;margin:0}
dialog{border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx);width:min(560px,94vw);max-height:90vh;padding:16px;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}

/* Nova OS: janela ampliada para facilitar o preenchimento */
dialog:has(#o_no){
  width:min(1080px,96vw);
  max-width:1080px;
  max-height:94vh;
  padding:24px;
  border-radius:14px;
}
dialog:has(#o_no) h2{font-size:1.35rem;margin:0 0 16px}
dialog:has(#o_no) label{font-size:1rem;margin-bottom:14px}
dialog:has(#o_no) label input,
dialog:has(#o_no) label select{min-height:48px;padding:11px 12px;font-size:1rem}
dialog:has(#o_no) h3{font-size:1.05rem;margin:14px 0 8px}
dialog:has(#o_no) .bar input{min-height:48px}
dialog:has(#o_no) .bar button,
dialog:has(#o_no) .row button{min-height:44px}
/* Locação usa a mesma largura da tela de OS */
dialog:has(#l_cliente){
  width:min(1080px,96vw);
  max-width:1080px;
  max-height:94vh;
  padding:24px;
  border-radius:14px;
}
dialog:has(#l_cliente) h2{font-size:1.35rem;margin:0 0 16px}
dialog:has(#l_cliente) label{font-size:1rem;margin-bottom:12px}
dialog:has(#l_cliente) label input,
dialog:has(#l_cliente) label select{min-height:46px;padding:10px 12px}
dialog:has(#l_cliente) .bar input{min-height:48px}
@media(max-width:700px){
  dialog:has(#o_no),dialog:has(#l_cliente){
    width:96vw;
    max-width:96vw;
    max-height:94dvh;
    padding:16px;
  }
}
@media(max-width:520px){
  dialog:has(#o_no),dialog:has(#l_cliente){
    width:100vw;
    max-width:100vw;
    max-height:96dvh;
    margin:auto 0 0;
    border-radius:14px 14px 0 0;
    padding:14px;
  }
}

.msg{background:var(--wnb);color:var(--wn);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:.9rem}
.warn{color:var(--er);font-size:.9rem;margin:6px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media (max-width:520px){.g2{grid-template-columns:1fr}}
.rw{display:flex;gap:6px;margin-bottom:6px}.rw input{padding:7px;min-width:0}.rw .q{width:54px;flex:none}.rw .c{width:92px;flex:none}.rw button{flex:none}
.tm{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
h3{font-size:.95rem;margin:10px 0 6px}
#print{display:none}
.pr{font:11px/1.3 Arial,Helvetica,sans-serif;color:#000;background:#fff;width:194mm;text-transform:uppercase}
.pr table{width:100%;border-collapse:collapse;table-layout:fixed}
.pr td,.pr th{border:1px solid #000;padding:3px 5px;vertical-align:middle;word-wrap:break-word}
.pr .h{font-weight:700;font-style:italic;font-size:10px;margin:9px 0 2px}
.pr .c{text-align:center}
.pr .tn{text-transform:none}
@media print{@page{size:A4;margin:8mm}body{background:#fff}#app,dialog{display:none!important}#print{display:block!important}}

.brand{display:flex;align-items:center;gap:16px;padding:12px 14px;margin:0 0 16px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.05)}
.brand-logo{width:142px;max-height:70px;object-fit:contain}.brand-title{flex:1;min-width:0}.brand-title h1{margin:0;font-size:1.22rem}.brand-title .mu{margin-top:3px}.brand-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:9px}.brand-version{font-size:.82rem;font-weight:800;letter-spacing:.07em;color:var(--tx);white-space:nowrap}#adminbox{flex:none}#adminbox .chip{white-space:nowrap}
@media(max-width:520px){.brand{gap:9px;padding:9px}.brand-logo{width:90px;max-height:55px}.brand-title h1{font-size:1rem}.brand-title .mu{font-size:.82rem}.brand-side{gap:6px}.brand-version{font-size:.72rem}#adminbox button{font-size:.78rem;padding:6px}}

/* Identidade visual New END — azul institucional e verde da marca */
:root{
  --bg:#f3f5f1;
  --sf:#ffffff;
  --tx:#202735;
  --mu:#606b73;
  --bd:#d8dfd7;
  --ac:#3c4271;
  --on:#ffffff;
  --ok:#5e8d34;
  --okb:#eaf2e2;
  --wn:#8a5a13;
  --wnb:#fbf1dc;
  --er:#b3261e;
  --erb:#f9e7e5;

}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151a20;--sf:#202832;--tx:#edf1f3;--mu:#aab5bd;--bd:#394550;
    --ac:#9298d0;--on:#171b2d;--ok:#a4cf79;--okb:#293a27;
    --wn:#f0c36c;--wnb:#40351f;--er:#ff938a;--erb:#482a2a;--mub:#303b42;

  }
}

  --bg:#151a20;--sf:#202832;--tx:#edf1f3;--mu:#aab5bd;--bd:#394550;
  --ac:#9298d0;--on:#171b2d;--ok:#a4cf79;--okb:#293a27;
  --wn:#f0c36c;--wnb:#40351f;--er:#ff938a;--erb:#482a2a;--mub:#303b42;

body{font-size:16.5px;line-height:1.5}
#app{max-width:1200px;padding:22px 22px 48px}
.brand{
  gap:24px;padding:20px 26px;margin-bottom:22px;
  border:1px solid #dce4d8;border-top:5px solid #5e8d34;
  border-radius:16px;
  background:linear-gradient(112deg,#ffffff 0%,#fbfcfa 68%,#f1f5ed 100%);

button{border-radius:10px;padding:10px 16px;transition:background .15s,border-color .15s,transform .15s}
button.pri{background:#3c4271;border-color:#3c4271}
button.pri:hover{background:#2f355f;border-color:#2f355f}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7d83bd;outline-offset:2px}
input,select{padding:10px 12px;border-radius:10px}
.card{border-radius:12px;padding:15px 16px;box-shadow:0 2px 8px rgba(35,48,39,.035)}
.stat{border-radius:11px;padding:11px 15px}
.stat b{font-size:1.45rem}

dialog{border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.22)}
/* Ajustes responsivos para preservar a hierarquia da marca */
@media(max-width:760px){
  #app{padding:12px 12px 32px}

}

/* Calibrações: cartões Aparelhos / Blocos */
.calcards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.calcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 12px;border-radius:12px;border:2px solid transparent;text-align:center;font:inherit;cursor:pointer;color:var(--tx)}
.calcard svg{width:22px;height:22px}
.calcard b{font-size:1.1rem}
.calcard span{font-size:.95rem}
.calcard.ap{background:color-mix(in srgb,var(--ac) 12%,var(--sf));color:var(--ac)}
.calcard.bl{background:color-mix(in srgb,var(--ok) 14%,var(--sf));color:var(--ok)}
.calcard b{color:var(--tx)}
.calcard.on.ap{border-color:var(--ac)}
.calcard.on.bl{border-color:var(--ok)}
.calnote{font-size:.85rem;color:var(--mu);margin:0 0 14px}
@media(max-width:520px){.calcards{gap:8px}.calcard{padding:14px 8px}}

<body>
<div id="app">
  <header class="brand"><img src="/logo.png" alt="New END" class="brand-logo"><div class="brand-title"><h1>Controle de Patrimônio e OS</h1><div class="mu">Gestão interna · New END</div></div><div class="brand-side"><div class="brand-version">VERSÃO 5</div><div id="adminbox"><button class="sm" data-a="adminLogin">Acesso administrador</button></div></div></header>
  <div id="msg"></div>
  <div class="tabs" id="tabs"></div>
  <div id="view"><div class="empty">Carregando…</div></div>
</div>
<div id="print"></div>
<dialog id="dlg"></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
function multiMatch(k,txt){const t=String(k||'').split(/[,;\n]+/).map(x=>x.trim().toLowerCase()).filter(Boolean);if(!t.length)return true;txt=String(txt).toLowerCase();return t.some(x=>txt.includes(x))}

let EQ=[],OS=[],CL=[],PE=[],VE=[],TP=[],BL=[],LOC=[],LISTABL=[],SELB=new Set(),calSub='ap',ftipo='',flt='all',tab='eq',sub='cli',q='',cur=null,MT=[],TM=[],warned=false,db=null,DL=null,loaded=false,isAdmin=false,SEL=new Set(),LISTA=[];
const LS='ctrl_patrimonio_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fmt=d=>d?d.split('-').reverse().join('/'):'—';
const addYear=d=>{const x=new Date(d+'T12:00:00');x.setFullYear(x.getFullYear()+1);return x.toISOString().slice(0,10)};
const daysTo=d=>Math.round((new Date(d+'T12:00:00')-new Date(today()+'T12:00:00'))/864e5);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=n=>'OS-'+String(n).padStart(4,'0');
const rows=s=>(s.docs||[]).map(d=>typeof d.data==='function'?d.data():d.data);

/* ---------- armazenamento ---------- */
const LOGO='/logo.png';
const NOLOGIN='Entre na sua conta Claude para ver e salvar os dados do time.';
const CAD={cli:{t:'Clientes',f:[['nome','Nome ou razão social'],['cnpj','CNPJ'],['resp','Responsável'],['contato','Contato'],['local','Local']]},pes:{t:'Equipe',f:[['nome','Nome completo']]},vei:{t:'Veículos',f:[['placa','Placa'],['modelo','Veículo (modelo)']]},tip:{t:'Tipos de item',f:[['nome','Nome do tipo']]}};
const GET={eq:()=>EQ,os:()=>OS,cli:()=>CL,pes:()=>PE,vei:()=>VE,tip:()=>TP,blo:()=>BL,loc:()=>LOC},SET={eq:v=>EQ=v,os:v=>OS=v,cli:v=>CL=v,pes:v=>PE=v,vei:v=>VE=v,tip:v=>TP=v,blo:v=>BL=v,loc:v=>LOC=v};
function localSave(){try{localStorage.setItem(LS,JSON.stringify({EQ,OS,CL,PE,VE,TP,BL}))}catch(e){}}
function upsert(arr,o){const i=arr.findIndex(x=>x.id===o.id);i>=0?arr[i]=o:arr.push(o)}
async function save(c,o){
  if(db){try{await db.collection(c).doc(o.id).set(o)}catch(e){note('Não foi possível salvar. Verifique a conexão com o servidor ou peça apoio ao administrador de TI.')}}
  else note(NOLOGIN)
}
async function del(c,id){
  if(db){try{await db.collection(c).doc(id).delete()}catch(e){note('Não foi possível excluir.')}}
  else note(NOLOGIN)
}
function makeDB(){
  const subs={},last={};
  const J=(u,o)=>fetch(u,o).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
  const poll=c=>J('/api/'+c).then(a=>{const k=JSON.stringify(a);if(k===last[c])return;last[c]=k;subs[c]&&subs[c].n({docs:a.map(o=>({data:()=>o}))})}).catch(e=>{last[c]=null;subs[c]&&subs[c].e&&subs[c].e(e)});
  setInterval(()=>Object.keys(subs).forEach(poll),5000);
  const put=(c,id,m,b)=>J('/api/'+c+'/'+encodeURIComponent(id),{method:m,headers:{'Content-Type':'application/json'},body:b}).then(()=>poll(c));
  return{collection:c=>({doc:id=>({set:o=>put(c,id,'PUT',JSON.stringify(o)),delete:()=>put(c,id,'DELETE')}),onSnapshot:(n,e)=>{subs[c]={n,e};poll(c);return()=>{delete subs[c]}}})};
}
function makeDL(){return{save:({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return Promise.resolve()}}}
async function adminStatus(){try{const r=await fetch('/api/admin/status');const j=await r.json();isAdmin=!!j.admin}catch(e){isAdmin=false}drawAdmin()}
function drawAdmin(){const b=$('#adminbox');if(!b)return;b.innerHTML=isAdmin?'<span class="chip ok">Administrador</span> <button class="sm" data-a="adminLogout">Sair</button>':'<button class="sm" data-a="adminLogin">Acesso administrador</button>'}
async function adminLogin(){dlg(`<h2>Acesso administrador</h2><label>Senha administrativa<input id="admin_pass" type="password" autocomplete="current-password"></label><div id="err" class="warn"></div><div class="row"><button class="pri" data-a="adminSubmit">Entrar</button><button data-a="close">Cancelar</button></div>`)}
async function adminSubmit(){const password=$('#admin_pass').value;try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});const j=await r.json();if(!r.ok)throw new Error(j.erro||'Senha inválida');isAdmin=true;$('#dlg').close();drawAdmin();render();note('Acesso de administrador ativado nesta sessão.')}catch(e){err(e.message||'Não foi possível entrar.')}}
async function adminLogout(){await fetch('/api/admin/logout',{method:'POST'});isAdmin=false;drawAdmin();render();note('Sessão administrativa encerrada.')}
function note(t){$('#msg').innerHTML=t?`<div class="msg">${esc(t)}</div>`:''}
(async()=>{
  await adminStatus();
  if(window.claude){try{db=await claude.use('db')}catch(e){db=null}}else db=makeDB();
  if(window.claude){try{DL=await claude.use('downloads')}catch(e){DL=null}}else DL=makeDL();
  if(db){
    const t=setTimeout(()=>note('Banco de dados sem resposta. Os dados podem estar desatualizados.'),10000);
    Object.keys(SET).forEach(c=>db.collection(c).onSnapshot(s=>{clearTimeout(t);note('');SET[c](rows(s));loaded=true;render()},()=>{clearTimeout(t);note('Erro ao ler os dados.')}));
  }else{
    
    loaded=true;render();
  }
  setTimeout(()=>{loaded=true;render()},3000);
})();

/* ---------- regras ---------- */
function inOpenOS(){const m={};OS.filter(o=>o.status==='Aberta').forEach(o=>(o.items||[]).forEach(i=>m[i.id]=o));return m}
function calSt(e){
  if(!e.needsCal)return'na';
  if(!e.calDue)return'sem';
  const d=daysTo(e.calDue);return d<0?'venc':d<=30?'prox':'ok';
}
function calChip(e){
  const s=calSt(e);
  if(s==='na')return'';
  if(s==='sem')return'<span class="chip wn">Sem calibração registrada</span>';
  const d=daysTo(e.calDue);
  if(s==='venc')return`<span class="chip er">Calibração vencida há ${-d} d</span>`;
  if(s==='prox')return`<span class="chip wn">Vence em ${d} d (${fmt(e.calDue)})</span>`;
  return`<span class="chip ok">Calibrado até ${fmt(e.calDue)}</span>`;
}
const TIPOS_PADRAO=['Aparelho','Cabeçote','Scanner','Bateria','Carregador','Fonte','Encoder','Sapata'];
function tiposList(atual){
  const n=TP.map(t=>t.nome).filter(Boolean);
  const base=n.length?n:TIPOS_PADRAO;
  const l=[...base];
  if(atual&&!l.some(t=>t.toLowerCase()===String(atual).toLowerCase()))l.push(atual);
  return l.sort((a,b)=>a.localeCompare(b,'pt'));
}
const tipoEmUso=nome=>EQ.filter(e=>(e.tipo||'').toLowerCase()===String(nome||'').toLowerCase());
const osLabel=o=>o.no||num(o.num);
function nextNo(){const y=today().slice(0,4);let m=0;OS.forEach(o=>{const p=(o.no||'').split('-');if(p[0]===y)m=Math.max(m,+p[1]||0)});return y+'-'+String(m+1).padStart(3,'0')+'-0'}
const norm=x=>String(x||'').toUpperCase().replace(/[^A-Z0-9]/g,'');

/* ---------- telas ---------- */

function tiposBlocoList(){const l=[...TIPOS_BLOCO];BL.forEach(b=>{if(b.tipo&&!l.some(t=>t.toLowerCase()===b.tipo.toLowerCase()))l.push(b.tipo)});return l.sort((a,b)=>a.localeCompare(b,'pt'))}

  return `<div class="stats"><div class="stat"><b>${all.length}</b>cadastrados</div><div class="stat"><b>${emCampo}</b>em campo</div><div class="stat"><b style="color:var(--er)">${venc}</b>calibração vencida</div><div class="stat"><b style="color:var(--wn)">${prox}</b>vencem em 30 dias</div></div>

  (list.length?list.map(b=>`<div class="card" data-a="editBlo" data-id="${b.id}"${SELB.has(b.id)?' style="outline:2px solid var(--er)"':''}><div class="top">${isAdmin?`<input type="checkbox" data-a="selBlo" data-id="${b.id}"${SELB.has(b.id)?' checked':''} aria-label="Selecionar" style="width:22px;height:22px;margin-right:8px;flex:none">`:''}<div style="flex:1"><div class="pat">${esc(b.ident)}</div><div>${esc(b.tipo)}</div><div class="mu">${esc(bloDesc(b))||'—'}</div></div><div>${calChip(b)}</div></div></div>`).join(''):`<div class="empty">${loaded?(BL.length?'Nenhum bloco encontrado.':'Nenhum bloco cadastrado. Toque em Novo bloco para começar.'):'Carregando…'}</div>`);

function exportBlocos(apenasFiltrados){
  if(!window.XLSX){note('Não foi possível carregar o componente de Excel. Verifique a conexão com a internet e tente novamente.');return}
  const k=q.toLowerCase();
  const lista=(apenasFiltrados?BL.filter(b=>multiMatch(k,[b.tipo,b.ident,b.espessura,b.diam,b.material].join(' '))):[...BL]).sort((a,b)=>String(a.ident).localeCompare(String(b.ident),'pt',{numeric:true}));
  if(!lista.length){note('Não há blocos para exportar com a seleção atual.');return}
  const ws=XLSX.utils.json_to_sheet(lista.map(b=>({'Tipo':b.tipo||'','Identificação':b.ident||'','Espessura':b.espessura||'','Diâmetro externo':b.diam||'','Material':b.material||'','Última calibração':b.calDate||'','Validade':b.calDue||''})));
  ws['!cols']=[{wch:22},{wch:20},{wch:14},{wch:18},{wch:22},{wch:18},{wch:14}];
  ws['!autofilter']={ref:XLSX.utils.encode_range(XLSX.utils.decode_range(ws['!ref']))};
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Blocos');
  XLSX.writeFile(wb,`blocos-${apenasFiltrados?'filtrados-':''}${new Date().toISOString().slice(0,10)}.xlsx`);
  note(`${lista.length} bloco(s) exportado(s) para Excel.`);
}

function bloHist(b){const h=b.hist||[];return `<h3>Histórico de calibrações</h3>`+(h.length?`<div class="mu">${[...h].reverse().map(fmt).join(', ')}</div>`:'<div class="mu">Nenhum registro.</div>')}
function saveBlo(){
  const v=id=>$('#'+id).value.trim(),tipo=v('b_tipo'),ident=v('b_ident');
  if(!tipo||!ident)return err('Preencha o tipo e a identificação.');
  if(BL.some(x=>norm(x.ident)===norm(ident)&&(!cur||x.id!==cur.id)))return err('Já existe um bloco com essa identificação.');
  const cd=v('b_cd');let cv=v('b_cv');if(cd&&!cv)cv=addYear(cd);
  const hist=[...((cur&&cur.hist)||[])];
  if(cd&&!hist.includes(cd))hist.push(cd);
  save('blo',{...(()=>{const o={...(cur||{})};delete o.obs;return o})(),id:cur?cur.id:uid('b'),tipo,ident,espessura:v('b_esp'),diam:v('b_diam'),material:v('b_mat'),needsCal:true,calDate:cd,calDue:cd?cv:'',hist});
  $('#dlg').close();
}
function calDlgBlo(id){

const IMP={step:1,file:'',sheet:'',head:[],data:[],map:{},tiposNovos:true,atualizar:false,tipoPadrao:'',items:[],res:null};
const IMP_CAMPOS=[['pat','Patrimônio *'],['desc','Descrição *'],['tipo','Tipo'],['serie','Nº de série / SN (Notebook)'],['serie2','Nº de série (tela)'],['configuracao','Configuração (Notebook)'],['chaveIdentificacao','Chave de identificação (Notebook)'],['bitlocker','BitLocker (Notebook)'],['calDate','Última calibração'],['calDue','Validade da calibração'],['obs','Observações']];
const IMP_SIN={
  pat:['patrimonio','pat','tag','codigo','cod','npatrimonio','numpatrimonio','nopatrimonio','numerodopatrimonio','numeropatrimonio'],
  desc:['descricao','desc','equipamento','item','nome','modelo','descricaodoequipamento'],

  obs:['observacoes','observacao','obs','anotacoes']

const impN=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const impS=v=>v==null?'':String(v).trim();
const colName=i=>{let s='',n=i+1;while(n>0){const r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s};
function impDt(y,m,d){y=+y;m=+m;d=+d;const x=new Date(y,m-1,d);if(y<1990||y>2100||x.getMonth()!==m-1||x.getDate()!==d)return{err:1};return{v:y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}}
function impData(v){
  if(v===''||v==null)return{v:''};
  if(typeof v==='number'){const p=window.XLSX&&XLSX.SSF.parse_date_code(v);return p?impDt(p.y,p.m,p.d):{err:1}}
  const t=String(v).trim();if(!t)return{v:''};let m;
  if((m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return impDt(m[1],m[2],m[3]);
  if((m=t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/)))return impDt(m[3].length===2?'20'+m[3]:m[3],m[2],m[1]);
  return{err:1};
}
function parseCSV(t){
  t=t.replace(/^\uFEFF/,'');
  const first=t.split(/\r?\n/,1)[0]||'';
  const sep=[';','\t',','].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===sep){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
}
function impAutoMap(){
  IMP.map={};const ordem=['serie2','serie','configuracao','chaveIdentificacao','bitlocker','pat','desc','tipo','calDate','calDue','obs'];
  IMP.head.forEach((h,i)=>{const n=impN(h);if(!n)return;for(const f of ordem){if(IMP.map[f]!==undefined)continue;if(IMP_SIN[f].includes(n)){IMP.map[f]=String(i);break}}});
}
function impAnalisar(){
  const g=(row,f)=>{const c=IMP.map[f];return c===''||c===undefined?'':row[+c]};
  const exist=new Map(EQ.map(e=>[String(e.pat).trim().toLowerCase(),e]));
  const visto=new Map(),novos=new Map(),tipos=tiposList();
  const padrao=IMP.tipoPadrao||(tipos.includes('Aparelho')?'Aparelho':tipos[0]||'Aparelho');
  IMP.items=IMP.data.map(({linha,row})=>{
    const mot=[];
    let patV=g(row,'pat');if(typeof patV==='number'&&Number.isInteger(patV)&&patV>=0&&patV<10000)patV=String(patV).padStart(4,'0');
    const pat=impS(patV),desc=impS(g(row,'desc')),serie=impS(g(row,'serie')),serie2=impS(g(row,'serie2')),configuracao=impS(g(row,'configuracao')),chaveIdentificacao=impS(g(row,'chaveIdentificacao')),bitlocker=impS(g(row,'bitlocker')),obs=impS(g(row,'obs'));
    const tipoInf=impS(g(row,'tipo'));let tipo=tipoInf;
    if(!pat)mot.push('Patrimônio em branco');
    if(!desc)mot.push('Descrição em branco');
    const d1=impData(g(row,'calDate')),d2=impData(g(row,'calDue'));
    if(d1.err)mot.push('Data da última calibração inválida');
    if(d2.err)mot.push('Validade da calibração inválida');
    if(!tipo)tipo=padrao;
    else{const f=tipos.find(t=>t.toLowerCase()===tipo.toLowerCase());
      if(f)tipo=f;
      else if(IMP.tiposNovos){const k=tipo.toLowerCase();if(novos.has(k))tipo=novos.get(k);else novos.set(k,tipo)}
      else mot.push('Tipo não cadastrado: '+tipo)}
    let status='novo',ref=null;
    if(mot.length)status='erro';
    else{const key=pat.toLowerCase();
      if(visto.has(key)){status='dupPlan';mot.push('Patrimônio repetido na linha '+visto.get(key))}
      else{visto.set(key,linha);const ex=exist.get(key);
        if(ex){ref=ex;if(IMP.atualizar)status='atualizar';else{status='dup';mot.push('Patrimônio já cadastrado ('+ex.desc+')')}}}}
    let obj=null;
    if(status==='novo'){
      const calDate=d1.v||'',calDue=d2.v||(calDate?addYear(calDate):'');
      obj={id:uid('e'),pat,desc,tipo,hasSerie:!!(serie||serie2),serie,serie2,configuracao,chaveIdentificacao,bitlocker,needsCal:!!(calDate||calDue),calDate,calDue,obs};
    }else if(status==='atualizar'){

      if(d1.v||d2.v){obj.needsCal=true;if(d1.v)obj.calDate=d1.v;obj.calDue=d2.v||(d1.v?addYear(d1.v):obj.calDue)}
      if(obs)obj.obs=obs;
    }
    return{linha,row,pat,desc,tipo,serie,serie2,configuracao,chaveIdentificacao,bitlocker,calDate:d1.v||'',calDue:d2.v||'',status,mot,obj};
  });
}
async function impLer(file){
  try{
    const buf=await file.arrayBuffer();let rows,sheet='';
    if(/\.(csv|txt)$/i.test(file.name)){
      let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(_){txt=new TextDecoder('windows-1252').decode(buf)}
      rows=parseCSV(txt);
    }else{
      if(!window.XLSX)return err('Não foi possível carregar o componente de Excel. Verifique a conexão com a internet e tente novamente.');
      const wb=XLSX.read(buf,{type:'array'});
      sheet=wb.SheetNames[0];
      rows=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,raw:true,defval:''});
    }
    const lin=rows.map((r,i)=>({linha:i+1,row:r})).filter(x=>x.row.some(c=>impS(c)!==''));
    if(lin.length<2)return err('A planilha precisa ter uma linha de títulos e ao menos um equipamento.');
    IMP.file=file.name;IMP.sheet=sheet;IMP.head=lin[0].row.map(impS);IMP.data=lin.slice(1);
    impAutoMap();impAnalisar();IMP.step=2;IMP.res=null;impDraw();
  }catch(e){err('Não foi possível ler o arquivo. Use um arquivo .xlsx ou .csv válido.')}
}

async function impRun(){

const IMPB={step:1,file:'',sheet:'',head:[],data:[],map:{},atualizar:false,items:[],res:null};
const IMPB_CAMPOS=[['tipo','Tipo *'],['ident','Identificação *'],['espessura','Espessura'],['diam','Diâmetro externo'],['material','Material'],['calDate','Última calibração'],['calDue','Validade']];
const IMPB_SIN={
  tipo:['tipo','tipodebloco','categoria'],
  ident:['identificacao','identificacaodobloco','id','codigo','cod','bloco','numero','nbloco'],
  espessura:['espessura','esp'],
  diam:['diametroexterno','diametro','diamext','diametroext','dext'],
  material:['material'],
  calDate:['ultimacalibracao','ultimacal','datacalibracao','datadacalibracao','dtcalibracao','calibracao'],
  calDue:['validade','validadedacalibracao','validadecalibracao','proximacalibracao','vencimento','vencimentodacalibracao']
};
function impbDt(v){
  if(typeof v!=='number'){const t=impS(v),n=impN(v);
    if(!t||!n||['na','nao','sem','sc','nenhum','nenhuma','pendente','vencido','vencida','naopossui','naocalibrado','naoseaplica'].includes(n)||/^(sem|nao)/.test(n))return{v:'',sem:true}}
  return impData(v);
}
function impbAutoMap(){IMPB.map={};IMPB.head.forEach((h,i)=>{const n=impN(h);if(!n)return;for(const[f]of IMPB_CAMPOS){if(IMPB.map[f]!==undefined)continue;if(IMPB_SIN[f].includes(n)){IMPB.map[f]=String(i);break}}})}
function impbAnalisar(){
  const g=(row,f)=>{const c=IMPB.map[f];return c===''||c===undefined?'':row[+c]};
  const exist=new Map(BL.map(b=>[norm(b.ident),b])),visto=new Map();
  IMPB.items=IMPB.data.map(({linha,row})=>{
    const mot=[],tipo=impS(g(row,'tipo')),ident=impS(g(row,'ident')),espessura=impS(g(row,'espessura')),diam=impS(g(row,'diam')),material=impS(g(row,'material'));
    if(!tipo)mot.push('Tipo em branco');
    if(!ident)mot.push('Identificação em branco');
    const d1=impbDt(g(row,'calDate')),d2=impbDt(g(row,'calDue'));
    if(d1.err)mot.push('Data da última calibração inválida');
    if(d2.err)mot.push('Validade inválida');
    let status='novo',ref=null;
    if(mot.length)status='erro';
    else{const key=norm(ident);
      if(visto.has(key)){status='dupPlan';mot.push('Identificação repetida na linha '+visto.get(key))}
      else{visto.set(key,linha);const ex=exist.get(key);
        if(ex){ref=ex;if(IMPB.atualizar)status='atualizar';else{status='dup';mot.push('Identificação já cadastrada')}}}}
    const calDate=d1.v||'',calDue=d2.v||(calDate?addYear(calDate):'');let obj=null;
    if(status==='novo')obj={id:uid('b'),tipo,ident,espessura,diam,material,needsCal:true,calDate,calDue,hist:calDate?[calDate]:[]};
    else if(status==='atualizar'){
      obj={...ref};delete obj.obs;obj.tipo=tipo||obj.tipo;
      if(espessura)obj.espessura=espessura;if(diam)obj.diam=diam;if(material)obj.material=material;
      if(calDate||d2.v){obj.needsCal=true;if(calDate){obj.calDate=calDate;const h=[...(obj.hist||[])];if(!h.includes(calDate))h.push(calDate);obj.hist=h}obj.calDue=calDue}
    }
    return{linha,row,tipo,ident,espessura,diam,material,calDate:d1.v||'',calDue:d2.v||'',status,mot,obj};
  });
}
async function impbLer(file){
  try{
    const buf=await file.arrayBuffer();let rows,sheet='';
    if(/\.(csv|txt)$/i.test(file.name)){
      let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(_){txt=new TextDecoder('windows-1252').decode(buf)}
      rows=parseCSV(txt);
    }else{
      if(!window.XLSX)return err('Não foi possível carregar o componente de Excel. Verifique a conexão com a internet e tente novamente.');
      const wb=XLSX.read(buf,{type:'array'});sheet=wb.SheetNames[0];
      rows=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,raw:true,defval:''});
    }
    const lin=rows.map((r,i)=>({linha:i+1,row:r})).filter(x=>x.row.some(c=>impS(c)!==''));
    if(lin.length<2)return err('A planilha precisa ter uma linha de títulos e ao menos um bloco.');
    IMPB.file=file.name;IMPB.sheet=sheet;IMPB.head=lin[0].row.map(impS);IMPB.data=lin.slice(1);
    impbAutoMap();impbAnalisar();IMPB.step=2;IMPB.res=null;impbDraw();
  }catch(e){err('Não foi possível ler o arquivo. Use um arquivo .xlsx ou .csv válido.')}
}

async function impbRun(){
  if(!db)return note(NOLOGIN);
  const todo=IMPB.items.filter(i=>i.status==='novo'||i.status==='atualizar');
  if(!todo.length)return;
  const prog=$('#impb_prog');$('#impb_run').disabled=true;
  let ok=0,up=0,fail=0,off=false;
  for(let n=0;n<todo.length;n++){
    const it=todo[n];if(prog)prog.textContent='Importando '+(n+1)+' de '+todo.length+'…';
    try{await db.collection('blo').doc(it.obj.id).set(it.obj);upsert(BL,it.obj);it.final=it.status==='novo'?'cadastrado':'atualizado';it.status==='novo'?ok++:up++}
    catch(e){it.final='falha';it.mot.push('Erro ao salvar no servidor'+(e&&e.message?' (código '+e.message+')':''));fail++;if(e&&e.message==='404')off=true}
  }
  if(off)note('O servidor não reconhece a coleção de blocos. Substitua o server.js pela versão nova e reinicie o servidor.');
  IMPB.res={ok,up,fail};IMPB.step=3;render();impbDraw();
}

function exportEquipamentos(apenasFiltrados){
  if(!window.XLSX){note('Não foi possível carregar o componente de Excel. Verifique a conexão com a internet e tente novamente.');return}
  const m=inOpenOS(),k=q.toLowerCase();
  const ordenar=(a,b)=>String(a.pat).localeCompare(String(b.pat),'pt',{numeric:true});
  const lista=(apenasFiltrados
    ? EQ.filter(e=>multiMatch(k,e.pat+' '+e.desc+' '+(e.tipo||'')+' '+(e.tensao||'')+' '+(e.serie||'')+' '+(e.serie2||''))&&(!ftipo||e.tipo===ftipo)&&(flt==='all'||(flt==='em')===!!m[e.id]))
    : [...EQ]).sort(ordenar);
  if(!lista.length){note('Não há equipamentos para exportar com a seleção atual.');return}
  const linhas=lista.map(e=>({
    'Patrimônio':e.pat||'',
    'Descrição':e.desc||'',
    'Tipo':e.tipo||'',
    'Tensão da fonte':isFonte(e.tipo)?(e.tensao||''):'',
    'Configuração':isNotebook(e.tipo)?(e.configuracao||''):'',
    'Chave de identificação':isNotebook(e.tipo)?(e.chaveIdentificacao||''):'',
    'Possui número de série':e.hasSerie?'Sim':'Não',
    'Número de série (módulo)':!isNotebook(e.tipo)?(e.serie||''):'',
    'SN (Notebook)':isNotebook(e.tipo)?(e.serie||''):'',
    'Número de série (tela)':e.serie2||'',
    'Situação':m[e.id]?'Em campo':'Disponível',
    'Ordem de serviço':m[e.id]?osLabel(m[e.id]):'',
    'Exige calibração':e.needsCal?'Sim':'Não',
    'Última calibração':e.calDate||'',
    'Próxima calibração / validade':e.calDue||'',
    'Status da calibração':e.needsCal?({'venc':'Vencida','prox':'Vence em até 30 dias','sem':'Sem registro','ok':'Em dia'}[calSt(e)]||''):'Não se aplica',
    'Observações':e.obs||''
  }));
  const ws=XLSX.utils.json_to_sheet(linhas);
  ws['!cols']=[{wch:18},{wch:34},{wch:20},{wch:22},{wch:24},{wch:24},{wch:16},{wch:20},{wch:18},{wch:18},{wch:26},{wch:24},{wch:40}];
  ws['!autofilter']={ref:XLSX.utils.encode_range(XLSX.utils.decode_range(ws['!ref']))};
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Equipamentos');
  const data=new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb,`equipamentos-${apenasFiltrados?'filtrados-':''}${data}.xlsx`);
  note(`${lista.length} equipamento(s) exportado(s) para Excel.`);
}

  impbOpen:()=>{IMPB.step=1;IMPB.res=null;impbDraw()},impbBack:()=>{IMPB.step=1;impbDraw()},impbRun,impbRel,impbModelo,
  impbOpt:(id,b)=>{IMPB.atualizar=b.checked;impbAnalisar();impbDraw()},
  selBlo:id=>{SELB.has(id)?SELB.delete(id):SELB.add(id);render()},
  selAllBlo:()=>{LISTABL.forEach(b=>SELB.add(b.id));render()},
  selNoneBlo:()=>{SELB.clear();render()},
  delSelBlo:(id,b)=>{
    if(!isAdmin)return note('Somente o administrador pode excluir blocos.');
    const ids=[...SELB].filter(i=>BL.some(x=>x.id===i));
    if(!ids.length)return note('Nenhum bloco selecionado.');
    arm(b,'dselb',async()=>{for(const i of ids){await del('blo',i);SELB.delete(i)}render();note(ids.length+' bloco(s) excluído(s).')});
  },
  exportBloFiltered:()=>exportBlocos(true),exportBloAll:()=>exportBlocos(false),
  newBlo:()=>bloDlg(),editBlo:id=>bloDlg(BL.find(b=>b.id===id)),saveBlo,
  bcdChange:()=>{const d=$('#b_cd').value;if(d)$('#b_cv').value=addYear(d)},
  delBlo:(id,b)=>{if(!isAdmin)return err('Somente o administrador pode excluir blocos.');arm(b,'dbl',()=>{del('blo',cur.id);$('#dlg').close()})},
  calDlgBlo,saveCalBlo:()=>{const d=$('#c_d').value;if(!d)return;const h=[...(cur.hist||[])];if(!h.includes(d))h.push(d);save('blo',{...cur,needsCal:true,calDate:d,calDue:addYear(d),hist:h});$('#dlg').close()},
  saveCal:()=>{const d=$('#c_d').value;if(!d)return;save('eq',{...cur,calDate:d,calDue:addYear(d),hist:[...(cur.hist||[]),d]});$('#dlg').close()},
  newCad:()=>cadDlg(),editCad:id=>cadDlg(GET[sub]().find(x=>x.id===id)),saveCad,
  delCad:(id,b)=>{if(!isAdmin)return err('Somente o administrador pode excluir cadastros.');if(sub==='tip'){const n=tipoEmUso(cur.nome).length;if(n)return err('Este tipo está em uso por '+n+' item(ns). Troque o tipo desses itens antes de excluir.')}arm(b,'dc',()=>{del(sub,cur.id);$('#dlg').close()})},
  newOS:()=>{if(!EQ.length&&!BL.length){note('Cadastre ao menos um equipamento ou bloco antes de criar uma OS.');return}note('');osDlg()},
  saveOS,osDet:id=>osView(OS.find(o=>o.id===id)),print:printOS,pdf:(id,b)=>pdfOS(b),
  addPes:()=>addPes($('#o_n').value),rmPes:i=>{TM.splice(+i,1);drawTeam()},
  addAvulso:()=>{const el=$('#o_a'),t=(el.value||'').trim();if(t&&(EQ.some(x=>x.pat===t||x.serie===t||x.serie2===t)||BL.some(x=>x.ident===t))){addEq(t);return}MT.push({qtd:1,pat:'',desc:t});el.value='';drawRows();if(!t){const d=document.querySelectorAll('#o_rows input[data-k=desc]');d.length&&d[d.length-1].focus()}},rmRow:i=>{MT.splice(+i,1);drawRows()},
  ret:()=>{save('os',{...cur,status:'Devolvida',ret:today()});$('#dlg').close()},
  delOS:(id,b)=>{if(!isAdmin)return err('Somente o administrador pode excluir OS.');arm(b,'do',()=>{del('os',cur.id);$('#dlg').close()})},
  reativar:()=>reativarDlg(),reativarOk,osBack:()=>osView(cur),
  impOpen:()=>{IMP.step=1;IMP.res=null;impDraw()},impBack:()=>{IMP.step=1;impDraw()},impRun,impRel,impModelo,
  impOpt:(id,b)=>{IMP[id]=b.checked;impAnalisar();impDraw()},
  buscaCnpj,
  newLoc:()=>locDlg(),locAddEq:locAddItem,locCamera:i=>$('#loc_photo_'+i)?.click(),
  locRmEq:i=>{locDraftItems.splice(+i,1);$('#locItems').innerHTML=locItemsHtml()},
  locRmPhoto:v=>{const [i,j]=v.split(':').map(Number);locDraftItems[i]?.photos.splice(j,1);$('#locItems').innerHTML=locItemsHtml()},
  saveLoc,locDetail,locEdit:()=>locDlg(cur),locPrint,delLoc,locAddAvulso,locUp:i=>locMove(+i,-1),locDown:i=>locMove(+i,1),locReturn:async()=>{if(!cur)return;const l={...cur,status:'Devolvida',devolucao:today(),atualizado:new Date().toISOString()};await save('loc',l);upsert(LOC,l);$('#dlg').close();render();note('Devolução registrada.')},
  close:()=>$('#dlg').close()
};
document.addEventListener('click',e=>{
  const t=e.target;if(t.tagName==='INPUT'&&t.type!=='checkbox')return;
  const b=t.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.id,b);
});
const auto=(a,v)=>{if(a==='ftipo'){ftipo=v;render()}else if(a==='fCli')fillCli();else if(a==='fVei')fillVei();else if(a==='fPes')addPes(v,true);else if(a==='fEq')addEq(v,true)};
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset||{};
  if(d.a==='busca'){q=t.value;const p=t.selectionStart;render();const i=$('#busca');i.focus();i.setSelectionRange(p,p)}
  else if(d.r!==undefined){const r=MT[+d.r];r[d.k]=d.k==='qtd'?(+t.value||1):t.value}
  else if(!e.inputType||e.inputType==='insertReplacementText')auto(d.a,t.value);
});
document.addEventListener('change',e=>{const d=e.target.dataset||{};
  if(d.locphoto!==undefined){locPhotosInput(e.target);return}
  if(d.litem!==undefined){const item=locDraftItems[+d.litem];if(item)item[d.k]=e.target.value;return}if(d.a==='cdChange')A.cdChange();else if(d.a==='bcdChange')A.bcdChange();else if(d.a==='tipoSel')A.tipoSel();
  else if(d.a==='impFile')impLer(e.target.files[0]);
  else if(d.a==='impbFile')impbLer(e.target.files[0]);
  else if(d.a==='impbMap'){IMPB.map[d.id]=e.target.value;impbAnalisar();impbDraw()}
  else if(d.a==='impMap'){IMP.map[d.id]=e.target.value;impAnalisar();impDraw()}
  else if(d.a==='impTipo'){IMP.tipoPadrao=e.target.value;impAnalisar();impDraw()}
  else auto(d.a,e.target.value)});
$('#dlg').addEventListener('close',()=>{$('#dlg').style.width=''});
</script>
</body>
</html>
